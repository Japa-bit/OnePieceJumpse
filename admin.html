<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel ADM - One Piece RPG</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #1b1b1b;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.panel {
  width: 450px;
  background: #2b1d1d;
  padding: 20px;
  border: 3px solid gold;
  box-shadow: 0 0 20px black;
}

h1 {
  text-align: center;
  color: gold;
  margin-bottom: 15px;
}

input {
  width: 95%;
  padding: 10px;
  margin: 6px 0;
  border: none;
  border-radius: 5px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: gold;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: orange;
}

small {
  color: #aaa;
}
</style>
</head>

<body>

<div class="panel">
  <h1>⚓ PAINEL ADM</h1>

  <input id="personagem" placeholder="Personagem (ex: Luffy)">
  <input id="senha" placeholder="Senha do jogador">
  <input id="ilha" placeholder="Código da ilha (ex: FI)">
  <input id="numero" placeholder="Número ID (ex: 6823)">

  <input id="ilhaNascimento" placeholder="Ilha de nascimento">
  <input id="ilhaAtual" placeholder="Ilha atual">
  <input id="faccao" placeholder="Facção (Piratas, Marinha...)">
  <input id="tripulacao" placeholder="Tripulação">

  <input id="beli" placeholder="Berries (ex: 25000)">
  <input id="fruta" placeholder="Fruta (ou Nenhuma)">

  <button onclick="criarConta()">CRIAR CONTA</button>

  <small>⚠ Sistema administrativo da Marinha</small>
</div>

<script>
function criarConta() {

  const conta = {
    id: document.getElementById("ilha").value + document.getElementById("numero").value,

    senha: document.getElementById("senha").value,

    personagem: document.getElementById("personagem").value,
    ilhaNascimento: document.getElementById("ilhaNascimento").value,
    ilhaAtual: document.getElementById("ilhaAtual").value,
    faccao: document.getElementById("faccao").value,
    tripulacao: document.getElementById("tripulacao").value,

    level: 1,
    xp: 0,
    xpMax: 100,
    beli: Number(document.getElementById("beli").value),
    salario: 0,
    barco: "Nenhum",
    fruta: document.getElementById("fruta").value,
    ranking: 999
  };

  let contas = JSON.parse(localStorage.getItem("contas")) || [];
  contas.push(conta);

  localStorage.setItem("contas", JSON.stringify(contas));

  alert("Conta criada com sucesso! ID: " + conta.id);

  console.log(conta);
}
</script>

</body>
</html>
