<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ADM</title>

<link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div id="loginAdm" class="panel">
<h2>⚓ LOGIN ADM</h2>

<input id="admUser" placeholder="Usuário">
<input id="admPass" type="password" placeholder="Senha">

<button onclick="entrarAdm()">Entrar</button>
</div>

<div id="painel" class="panel">

<h2>⚓ CRIAR CONTA</h2>

<input id="id" placeholder="ID (FI6823)">
<input id="senha" placeholder="Senha">
<input id="nome" placeholder="Personagem">
<input id="ilhaN" placeholder="Ilha nascimento">
<input id="ilhaA" placeholder="Ilha atual">
<input id="faccao" placeholder="Facção">
<input id="trip" placeholder="Tripulação">
<input id="beli" placeholder="Beli">
<input id="fruta" placeholder="Fruta">

<button onclick="criar()">Criar Conta</button>

</div>

<script>
function entrarAdm(){

let u = document.getElementById("admUser").value;
let p = document.getElementById("admPass").value;

if(u === "admin" && p === "Luffy2026"){
document.getElementById("loginAdm").style.display="none";
document.getElementById("painel").style.display="block";
}else{
alert("Acesso negado!");
}
}

function criar(){

let conta = {
id: document.getElementById("id").value,
senha: document.getElementById("senha").value,
personagem: document.getElementById("nome").value,
ilhaNascimento: document.getElementById("ilhaN").value,
ilhaAtual: document.getElementById("ilhaA").value,
faccao: document.getElementById("faccao").value,
tripulacao: document.getElementById("trip").value,
level: 1,
xp: 0,
xpMax: 100,
beli: Number(document.getElementById("beli").value),
fruta: document.getElementById("fruta").value,
barco: "Nenhum",
ranking: 999
};

let contas = JSON.parse(localStorage.getItem("contas")) || [];
contas.push(conta);

localStorage.setItem("contas", JSON.stringify(contas));

alert("Conta criada!");
}
</script>

</body>
</html>
