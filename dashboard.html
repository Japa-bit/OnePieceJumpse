<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard RPG</title>

<style>
body{
margin:0;
font-family:Georgia;
background:#0f0f0f;
color:white;
display:flex;
justify-content:center;
padding:20px;
}

.card{
width:450px;
background:#1e1b18;
border:2px solid gold;
padding:20px;
}

h1{
color:gold;
text-align:center;
}

.bar{
width:100%;
height:15px;
background:#333;
}

.fill{
height:15px;
background:gold;
width:0%;
}
</style>
</head>

<body>

<div class="card">

<h1 id="nome"></h1>

<p>ID: <span id="id"></span></p>
<p>Ilha nascimento: <span id="ilhaN"></span></p>
<p>Ilha atual: <span id="ilhaA"></span></p>
<p>Facção: <span id="faccao"></span></p>
<p>Tripulação: <span id="trip"></span></p>
<p>Fruta: <span id="fruta"></span></p>

<p>Level: <span id="level"></span></p>

<p>XP</p>
<div class="bar"><div class="fill" id="xp"></div></div>

<p>Beli: <span id="beli"></span></p>
<p>Barco: <span id="barco"></span></p>
<p>Ranking: #<span id="rank"></span></p>

</div>

<script>

let p = JSON.parse(localStorage.getItem("playerAtivo"));

if(!p){
alert("Você não está logado!");
window.location.href="login.html";
}

document.getElementById("nome").innerText = p.personagem;
document.getElementById("id").innerText = p.id;
document.getElementById("ilhaN").innerText = p.ilhaNascimento;
document.getElementById("ilhaA").innerText = p.ilhaAtual;
document.getElementById("faccao").innerText = p.faccao;
document.getElementById("trip").innerText = p.tripulacao;
document.getElementById("fruta").innerText = p.fruta;
document.getElementById("level").innerText = p.level;
document.getElementById("beli").innerText = p.beli;
document.getElementById("barco").innerText = p.barco;
document.getElementById("rank").innerText = p.ranking;

let xp = (p.xp / p.xpMax) * 100;
document.getElementById("xp").style.width = xp + "%";

</script>

</body>
</html>
