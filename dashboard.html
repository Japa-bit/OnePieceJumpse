<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard RPG</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0f0f0f;
  color: white;
  display: flex;
  justify-content: center;
  padding: 30px;
}

.card {
  width: 500px;
  background: #1e1b18;
  border: 3px solid gold;
  padding: 20px;
  box-shadow: 0 0 20px black;
}

h1 {
  text-align: center;
  color: gold;
}

.info {
  margin: 8px 0;
  font-size: 16px;
}

.tag {
  color: gold;
}

.bar {
  width: 100%;
  height: 15px;
  background: #333;
  margin-top: 5px;
}

.bar-fill {
  height: 100%;
  background: gold;
  width: 0%;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: gold;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

  <h1 id="nome">Carregando...</h1>

  <div class="info"><span class="tag">ID:</span> <span id="id"></span></div>
  <div class="info"><span class="tag">Ilha Nascimento:</span> <span id="ilhaN"></span></div>
  <div class="info"><span class="tag">Ilha Atual:</span> <span id="ilhaA"></span></div>
  <div class="info"><span class="tag">Facção:</span> <span id="faccao"></span></div>
  <div class="info"><span class="tag">Tripulação:</span> <span id="trip"></span></div>
  <div class="info"><span class="tag">Fruta:</span> <span id="fruta"></span></div>

  <div class="info"><span class="tag">Level:</span> <span id="level"></span></div>

  <div class="info"><span class="tag">XP:</span></div>
  <div class="bar">
    <div class="bar-fill" id="xpbar"></div>
  </div>

  <div class="info"><span class="tag">Berries:</span> ฿ <span id="beli"></span></div>
  <div class="info"><span class="tag">Barco:</span> <span id="barco"></span></div>
  <div class="info"><span class="tag">Ranking:</span> #<span id="rank"></span></div>

  <button onclick="logout()">Sair</button>

</div>

<script>
const player = JSON.parse(localStorage.getItem("playerAtivo"));

if (!player) {
  alert("Você não está logado!");
  window.location.href = "index.html";
}

document.getElementById("nome").innerText = player.personagem;
document.getElementById("id").innerText = player.id;
document.getElementById("ilhaN").innerText = player.ilhaNascimento;
document.getElementById("ilhaA").innerText = player.ilhaAtual;
document.getElementById("faccao").innerText = player.faccao;
document.getElementById("trip").innerText = player.tripulacao;
document.getElementById("fruta").innerText = player.fruta;
document.getElementById("level").innerText = player.level;
document.getElementById("beli").innerText = player.beli;
document.getElementById("barco").innerText = player.barco;
document.getElementById("rank").innerText = player.ranking;

// XP bar
let xpPercent = (player.xp / player.xpMax) * 100;
document.getElementById("xpbar").style.width = xpPercent + "%";

function logout() {
  localStorage.removeItem("playerAtivo");
  window.location.href = "index.html";
}
</script>

</body>
</html>
