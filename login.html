<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login RPG</title>

<style>
body{
margin:0;
font-family:Georgia;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#2b1d1d;
padding:20px;
width:350px;
border:2px solid gold;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:8px 0;
}

button{
width:95%;
padding:10px;
background:gold;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>🏴‍☠️ LOGIN</h2>

<input id="id" placeholder="ID (ex: FI6823)">
<input id="senha" placeholder="Senha">

<button onclick="login()">Entrar</button>
</div>

<script>
function login(){

let id = document.getElementById("id").value;
let senha = document.getElementById("senha").value;

let contas = JSON.parse(localStorage.getItem("contas")) || [];

let user = contas.find(p => p.id === id && p.senha === senha);

if(!user){
alert("Conta não encontrada!");
return;
}

localStorage.setItem("playerAtivo", JSON.stringify(user));

window.location.href = "dashboard.html";
}
</script>

</body>
</html>
